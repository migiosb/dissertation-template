compile_pdf:
  image: container-registry.gitlab.cc-asp.fraunhofer.de/iosb-images/latex_ci_oci
  tags:
    - asprunner
  script:
    - xelatex -interaction=nonstopmode -no-pdf Diss.tex
    - biber Diss
    - makeglossaries Diss
    - xelatex -interaction=nonstopmode -no-pdf Diss.tex
    - xelatex -interaction=nonstopmode -no-pdf Diss.tex
    - xelatex -synctex=1 -interaction=nonstopmode Diss.tex
    - mv Diss.pdf Anleitung.pdf
  artifacts:
    paths:
      - Anleitung.pdf
    expire_in: '100yrs'
