name: Build and publish Introductory Guide

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile Diss.tex
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Diss.tex
          latexmk_use_xelatex: true
          os: debian
          extra_system_packages: xindy
          post_compile: mv Diss.pdf Anleitung.pdf

      - name: Upload LaTeX logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          if-no-files-found: ignore
          path: |
            Diss.log
            Diss.fls
            Diss.fdb_latexmk
            Diss.blg
            Diss.alg
            Diss.acn
            Diss.acr
            Diss.glg
            Diss.gls
            Diss.glo

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp Anleitung.pdf site/Anleitung.pdf
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html><body><h1>Dissertationsvorlage</h1>
          <p><a href="Anleitung.pdf">Anleitung</a></p>
          </body></html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4