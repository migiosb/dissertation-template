name: Build and publish Introductory Guide PDF

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full biber xindy

      - name: Compile Diss.tex
        run: |
          xelatex -interaction=nonstopmode -no-pdf Diss.tex
          biber Diss
          makeglossaries Diss
          xelatex -interaction=nonstopmode -no-pdf Diss.tex
          xelatex -interaction=nonstopmode -no-pdf Diss.tex
          xelatex -synctex=1 -interaction=nonstopmode Diss.tex

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp Diss.pdf site/Diss.pdf
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html><body><h1>Dissertationsvorlage</h1>
          <p><a href="Diss.pdf">Anleitung</a></p>
          </body></html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4